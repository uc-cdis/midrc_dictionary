$schema: "http://json-schema.org/draft-04/schema#"

id: "measurement"
title: Measurement
type: object
nodeTerms: null
namespace: https://data.midrc.org
category: medical_history
program: '*'
project: '*'
description: A structured value (numerical or categorical) obtained through systematic examination of a person or sample.
additionalProperties: false
submittable: true
validators: null

systemProperties:
  - id
  - project_id
  - state
  - created_datetime
  - updated_datetime

links:
  - exclusive: false
    required: true
    subgroup:
      - name: conditions
        backref: measurements
        label: related_to
        target_type: condition
        multiplicity: many_to_one
        required: false
      - name: procedures
        backref: measurements
        label: related_to
        target_type: procedure
        multiplicity: many_to_one
        required: false
      - name: cases
        backref: measurements
        label: related_to
        target_type: case
        multiplicity: many_to_one
        required: false

required:
  - submitter_id
  - type

uniqueKeys:
  - [id]
  - [project_id, submitter_id]

properties:

  $ref: "_definitions.yaml#/ubiquitous_properties"

  six_minute_walk_test:
    description: An indicator confirming whether the patient completed the 6 Minute Walk Test (6MWT).
    enum:
      - "Yes"
      - "No"
      - "Not Reported"

  home_oxygen_use:
    description: An indicator confirming whether home oxygen is used.
    enum:
      - "Yes"
      - "No"
      - "Not Reported"

  oxygenation_measurement_environment:
    description: The environment in which the oxygenation test was performed.
    enum:
      - Room air
      - Supplmental Oxygen
      - Not Reported

  pulmonary_function_test:
    description: An indicator confirming whether a pulmonary function test was performed.
    enum:
      - "Yes"
      - "No"
      - "Not Reported"

  test_days_from_index:
    description: A number of days beginning with the index date and ending with the date of the test.
    type: integer

  test_method:
    term:
      $ref: "_terms.yaml#/test_method"
    enum:
      - RT-PCR
      - Rapid antigen test
      - Not Reported

  test_name:
    term:
      $ref: "_terms.yaml#/test_name"
    enum:
      - COVID-19
      - FVC (L)
      - FEV1 (L)
      - 6-Minute Walk Test Distance
      - 6-Minute Walk Test Exertional Drop in O2 (%)
      - Oxygenation (SpO2)
      - Home Oxygen Quantity

  test_result_number:
    description: The result a test represented by a number.
    type: number

  test_result_percent:
    description: The result a test represented by a percent.
    type: number

  test_result_ratio:
    description: The result a test represented by a ratio.
    type: number

  test_result_text:
    term:
      $ref: "_terms.yaml#/test_result_text"
    enum:
      - Indeterminate
      - Negative
      - Positive
      - Not Reported

  cases:
    description: The submitter_id or id of the case(s) this measurement describes, i.e., a link to a record in the parent node.
    $ref: "_definitions.yaml#/to_one"

  conditions:
    description: The submitter_id or id of the condition this measurement describes, i.e., a link to a record in the parent node.
    $ref: "_definitions.yaml#/to_one"

  procedures:
    description: The submitter_id or id of the procedure this measurement describes, i.e., a link to a record in the parent node.
    $ref: "_definitions.yaml#/to_one"
